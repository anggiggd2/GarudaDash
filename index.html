.opt span{min-width:0}

<script>
(()=>{
'use strict';
const W=960,H=540,STEP=1/60,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function wrapText(s,maxW){const words=s.split(' ');const lines=[];let line='';for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;}if(line)lines.push(line);return lines;}

/* ================= AUDIO ================= */
let AC=null,muted=false;
function tone(f,d,type,vol,slide,delay){
  if(muted)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const SFX={
  ring(){tone(988,.08,'square',.035);tone(1319,.12,'square',.035,0,.07);},
  jump(){tone(330,.18,'square',.045,740);},
  good(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.07,0,i*.09));},
  bad(){tone(220,.28,'sawtooth',.05,110);},
  hurt(){tone(300,.3,'sawtooth',.05,90);},
  dash(){tone(200,.3,'sawtooth',.045,900);},
  stomp(){tone(520,.12,'square',.05,200);},
  piece(){[659,880,1175].forEach((f,i)=>tone(f,.14,'triangle',.07,0,i*.08));},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.07,0,i*.11));},
  spin(){tone(180,.3,'sawtooth',.05,1100);tone(900,.18,'square',.025,1800,.12);},
  step(){tone(140+Math.random()*30,.05,'triangle',.03);},
  splash(){tone(520,.22,'sine',.06,170);tone(260,.28,'triangle',.04,110,.05);},
  swim(){tone(300,.14,'sine',.04,430);},
  flap(){tone(260,.1,'triangle',.05,540);},
  wing(){[523,784,1047,1568].forEach((f,i)=>tone(f,.14,'triangle',.07,0,i*.06));}
};
function sfx(n){if(SFX[n])SFX[n]();}
function ensureAC(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,ensureAC,{passive:true}));
const MUS={on:false,step:0,next:0,timer:null,bpm:140,tr:0};
const PENT=[0,2,4,7,9,12,14,16,19,21];
const MEL=[5,-1,6,5,3,-1,2,3, 5,-1,7,5,8,-1,7,-1, 5,-1,6,5,3,-1,2,3, 4,-1,3,2,-1,-1,-1,-1];
const BASS=[0,-3,-7,-5];
function musicTick(){
  if(!MUS.on||muted||!AC)return;
  const sp=60/MUS.bpm/2;
  while(MUS.next<AC.currentTime+.35){
    const s=MUS.step%32,dl=Math.max(0,MUS.next-AC.currentTime),m=MEL[s];
    if(m>=0)tone(523.25*Math.pow(2,(PENT[m]+MUS.tr)/12),sp*1.6,'square',.014,0,dl);
    if(s%4===0)tone(130.81*Math.pow(2,(BASS[Math.floor(s/8)]+MUS.tr)/12),sp*3.4,'triangle',.04,0,dl);
    if(s%2===1)tone(1800,.03,'square',.004,0,dl);
    MUS.next+=sp;MUS.step++;
  }
}
function musicStart(n){n=({1:1,2:2,3:3,4:3,5:1})[n]||n;
  if(muted||MUS.on||!ensureAC())return;
  MUS.on=true;MUS.step=0;MUS.bpm=[0,140,164,112][n]||140;MUS.tr=[0,0,2,5][n]||0;MUS.next=AC.currentTime+.1;
  MUS.timer=setInterval(musicTick,100);musicTick();
}
function musicStop(){MUS.on=false;if(MUS.timer)clearInterval(MUS.timer);MUS.timer=null;}

/* ================= BANK SOAL ================= */
const Q=[
{id:'q1',stage:1,topic:'Zona 1 · Mengenal NKRI',q:'NKRI adalah singkatan dari ...',o:['Negara Kesatuan Republik Indonesia','Negara Konfederasi Rakyat Indonesia','Negara Kerajaan Republik Indonesia'],a:0,why:'NKRI berarti Negara Kesatuan Republik Indonesia: satu negara berdaulat yang wilayahnya terdiri atas banyak pulau, suku, dan budaya.'},
{id:'q2',stage:1,topic:'Zona 1 · Mengenal NKRI',q:'Kapan Proklamasi Kemerdekaan Indonesia dibacakan?',o:['17 Agustus 1945','28 Oktober 1928','1 Juni 1945'],a:0,why:'Proklamasi dibacakan oleh Ir. Soekarno dan Drs. Mohammad Hatta pada 17 Agustus 1945. Tanggal 28 Oktober 1928 adalah Sumpah Pemuda, dan 1 Juni 1945 adalah hari lahirnya rumusan Pancasila.'},
{id:'q3',stage:1,topic:'Zona 1 · Mengenal NKRI',q:'Sila Pancasila yang paling berkaitan langsung dengan menjaga persatuan NKRI adalah ...',o:['Sila ke-1: Ketuhanan Yang Maha Esa','Sila ke-3: Persatuan Indonesia','Sila ke-5: Keadilan sosial bagi seluruh rakyat Indonesia'],a:1,why:'Sila ke-3, Persatuan Indonesia, menekankan cinta tanah air, rela berkorban, dan menjaga persatuan di tengah keberagaman.'},
{id:'q4',stage:1,topic:'Zona 1 · Mengenal NKRI',q:'Semboyan negara Indonesia yang tertulis pada pita lambang Garuda Pancasila adalah ...',o:['Bhinneka Tunggal Ika','Tut Wuri Handayani','Gemah Ripah Loh Jinawi'],a:0,why:'Bhinneka Tunggal Ika berarti berbeda-beda tetapi tetap satu. Kalimat ini diambil dari kitab Sutasoma karya Mpu Tantular.'},
{id:'q5',stage:1,topic:'Zona 1 · Mengenal NKRI',q:'Menurut Pasal 1 ayat (1) UUD NRI Tahun 1945, bentuk negara Indonesia adalah ...',o:['Negara kesatuan yang berbentuk republik','Negara federal yang berbentuk republik','Negara kesatuan yang berbentuk kerajaan'],a:0,why:'Pasal 1 ayat (1): "Negara Indonesia ialah negara kesatuan yang berbentuk republik." Pasal 37 ayat (5) juga menegaskan bahwa bentuk NKRI tidak dapat diubah melalui perubahan UUD.'},
{id:'q6',stage:2,topic:'Zona 2 · Sejarah dan Persatuan',q:'Isi pokok Sumpah Pemuda 1928 adalah ...',o:['Satu tanah air, satu bangsa, satu bahasa persatuan','Satu partai, satu agama, satu bahasa','Satu pulau, satu suku, satu pemimpin'],a:0,why:'Sumpah Pemuda berisi tiga ikrar: bertumpah darah satu (tanah air Indonesia), berbangsa satu (bangsa Indonesia), dan menjunjung bahasa persatuan (bahasa Indonesia).'},
{id:'q7',stage:2,topic:'Zona 2 · Sejarah dan Persatuan',q:'Pancasila berkedudukan sebagai ... bagi bangsa Indonesia.',o:['Dasar negara dan pandangan hidup bangsa','Slogan perayaan hari besar saja','Peraturan yang berlaku di satu daerah'],a:0,why:'Pancasila adalah dasar negara, ideologi, sekaligus pandangan hidup yang mempersatukan seluruh rakyat Indonesia.'},
{id:'q8',stage:2,topic:'Zona 2 · Sejarah dan Persatuan',q:'Siapa yang berpidato pada 1 Juni 1945 di sidang BPUPK dan menamai dasar negara dengan sebutan Pancasila?',o:['Ir. Soekarno','Mr. Mohammad Yamin','Ki Hajar Dewantara'],a:0,why:'Ir. Soekarno menyampaikan pidato pada 1 Juni 1945 dan mengusulkan nama Pancasila. Karena itu 1 Juni diperingati sebagai Hari Lahir Pancasila.'},
{id:'q9',stage:2,topic:'Zona 2 · Sejarah dan Persatuan',q:'Teman-teman di kelasmu berbeda suku dan agama. Sikap yang menjaga persatuan NKRI adalah ...',o:['Saling menghormati dan bekerja sama','Hanya berteman dengan yang sesuku','Memaksakan kebiasaan sendiri kepada orang lain'],a:0,why:'Persatuan dijaga dengan saling menghargai, toleran, dan gotong royong. Perbedaan adalah kekayaan bangsa, bukan alasan untuk berpecah.'},

addQ('sd',[
[1,'Zona 1 · Mengenal Indonesiaku','Hewan yang menjadi lambang negara Indonesia adalah ...',['Burung Garuda','Harimau','Elang laut'],'Lambang negara kita adalah Garuda Pancasila. Burung Garuda membawa perisai berisi lima lambang sila di dadanya.'],
[1,'Zona 1 · Mengenal Indonesiaku','Sila pertama Pancasila berbunyi ...',['Ketuhanan Yang Maha Esa','Persatuan Indonesia','Keadilan sosial bagi seluruh rakyat Indonesia'],'Sila ke-1 adalah Ketuhanan Yang Maha Esa. Lambangnya bintang. Kita belajar beribadah sesuai agama masing-masing dan saling menghormati.'],
[1,'Zona 1 · Mengenal Indonesiaku','Warna bendera negara Indonesia adalah ...',['Merah dan putih','Merah dan biru','Putih dan hijau'],'Bendera kita bernama Sang Saka Merah Putih. Merah berarti berani, putih berarti suci.'],
[1,'Zona 1 · Mengenal Indonesiaku','Semboyan "Bhinneka Tunggal Ika" artinya ...',['Berbeda-beda tetapi tetap satu','Satu untuk semua','Maju terus pantang mundur'],'Bhinneka Tunggal Ika berarti berbeda-beda tetapi tetap satu. Suku, agama, dan budaya kita beragam, tetapi kita tetap satu bangsa.'],
[1,'Zona 1 · Mengenal Indonesiaku','Hari Kemerdekaan Indonesia diperingati setiap tanggal ...',['17 Agustus','28 Oktober','2 Mei'],'Indonesia merdeka pada 17 Agustus 1945. Setiap tahun kita merayakannya dengan upacara dan berbagai lomba.'],
[2,'Zona 2 · Gotong Royong dan Persatuan','Membersihkan selokan bersama warga adalah contoh sikap ...',['Gotong royong','Mementingkan diri sendiri','Bermusuhan'],'Gotong royong artinya bekerja bersama-sama. Pekerjaan berat menjadi ringan dan persatuan makin kuat.'],
[2,'Zona 2 · Gotong Royong dan Persatuan','Temanmu berbeda agama dan suku denganmu. Sikap yang baik adalah ...',['Tetap berteman dan saling menghormati','Menjauhinya','Mengejeknya'],'Perbedaan adalah kekayaan bangsa. Kita boleh berbeda, tetapi tetap berteman dan saling menghormati.'],
[2,'Zona 2 · Gotong Royong dan Persatuan','Lagu kebangsaan Indonesia adalah ...',['Indonesia Raya','Garuda Pancasila','Halo-Halo Bandung'],'Lagu kebangsaan kita adalah Indonesia Raya ciptaan W.R. Supratman, pertama kali dikumandangkan pada Sumpah Pemuda 1928.'],
[2,'Zona 2 · Gotong Royong dan Persatuan','Lambang sila ke-3 Pancasila (Persatuan Indonesia) adalah ...',['Pohon beringin','Bintang','Padi dan kapas'],'Sila ke-3 berlambang pohon beringin yang rindang, tempat banyak orang berteduh bersama. Bintang untuk sila ke-1, padi dan kapas untuk sila ke-5.'],
[2,'Zona 2 · Gotong Royong dan Persatuan','Saat upacara bendera, sikap yang benar ketika bendera dikibarkan adalah ...',['Berdiri tegak dan hormat','Bercanda dengan teman','Berlari-lari'],'Menghormati bendera berarti menghormati perjuangan para pahlawan. Kita berdiri tegak, tenang, dan hormat.'],
[3,'Zona 3 · Sumatera','Indonesia disebut negara kepulauan, artinya ...',['Terdiri dari banyak pulau','Hanya punya satu pulau besar','Tidak punya laut'],'Indonesia memiliki ribuan pulau yang dikelilingi laut, dari Sabang sampai Merauke. Semuanya satu kesatuan NKRI.'],
[3,'Zona 3 · Jawa','Contoh mencintai tanah air adalah ...',['Memakai produk buatan Indonesia','Membuang sampah sembarangan','Merusak fasilitas umum'],'Mencintai tanah air bisa dimulai dari hal kecil, misalnya bangga memakai produk dalam negeri dan menjaga kebersihan lingkungan.'],
[3,'Zona 3 · Kalimantan','Tugas utama pelajar sebagai anak bangsa adalah ...',['Belajar dengan rajin','Menyontek saat ujian','Membolos sekolah'],'Belajar dengan rajin dan jujur adalah cara pelajar membantu membangun negeri.'],
[3,'Zona 3 · Sulawesi','Rumah adat, tarian, dan pakaian daerah yang beraneka ragam menunjukkan bahwa Indonesia kaya akan ...',['Budaya','Salju','Gunung es'],'Setiap daerah punya budaya yang unik. Kita wajib menjaga dan melestarikannya.'],
[3,'Zona 3 · Papua','Sila ke-2 Pancasila mengajarkan kita bersikap ...',['Adil dan beradab terhadap sesama manusia','Menang sendiri','Tidak peduli pada orang lain'],'Sila ke-2: Kemanusiaan yang adil dan beradab. Kita menolong teman dan tidak membeda-bedakan orang.']
]);
addQ('smp',[
[1,'Zona 1 · Pancasila dan UUD 1945','Pancasila ditetapkan sebagai dasar negara pada sidang PPKI tanggal ...',['18 Agustus 1945','1 Juni 1945','17 Agustus 1945'],'PPKI menetapkan UUD 1945 beserta Pembukaannya, yang memuat Pancasila, pada 18 Agustus 1945. Tanggal 1 Juni 1945 adalah hari lahir Pancasila.'],
[1,'Zona 1 · Pancasila dan UUD 1945','Rumusan Pancasila yang sah terdapat pada ... UUD NRI Tahun 1945.',['Pembukaan alinea keempat','Pasal 1','Penjelasan pasal 33'],'Rumusan kelima sila yang sah dan berlaku tercantum pada alinea keempat Pembukaan UUD NRI Tahun 1945.'],
[1,'Zona 1 · Pancasila dan UUD 1945','Bunyi sila ke-4 Pancasila adalah ...',['Kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan','Persatuan Indonesia','Kemanusiaan yang adil dan beradab'],'Sila ke-4 berlambang kepala banteng dan mengajarkan musyawarah untuk mufakat dalam mengambil keputusan.'],
[1,'Zona 1 · Pancasila dan UUD 1945','Pada lambang Garuda Pancasila, jumlah bulu sayap (17), ekor (8), pangkal ekor (19), dan leher (45) melambangkan ...',['Tanggal Proklamasi: 17-8-1945','Jumlah provinsi Indonesia','Jumlah pulau terbesar'],'Angka 17, 8, dan 45 menunjuk pada 17 Agustus 1945, hari Proklamasi Kemerdekaan Indonesia.'],
[1,'Zona 1 · Pancasila dan UUD 1945','Menurut Pasal 1 ayat (2) UUD NRI Tahun 1945, kedaulatan berada di tangan ...',['Rakyat dan dilaksanakan menurut UUD','Presiden saja','Partai politik'],'Kedaulatan ada di tangan rakyat. Itulah dasar kehidupan demokrasi di Indonesia.'],
[2,'Zona 2 · Sejarah dan Persatuan','Sumpah Pemuda diikrarkan pada tanggal ...',['28 Oktober 1928','20 Mei 1908','17 Agustus 1945'],'Sumpah Pemuda 1928 berisi tiga ikrar: satu tanah air, satu bangsa, dan satu bahasa persatuan, yaitu Indonesia.'],

[2,'Zona 2 · Sejarah dan Persatuan','Badan yang bertugas menyelidiki usaha-usaha persiapan kemerdekaan Indonesia adalah ...',['BPUPK','MPR','DPR'],'BPUPK dibentuk pada 1945. Dalam sidangnya dirumuskan dasar negara, termasuk pidato Ir. Soekarno tentang Pancasila pada 1 Juni 1945.'],
[2,'Zona 2 · Sejarah dan Persatuan','Ketika ada perbedaan pendapat di kelas, cara terbaik menyelesaikannya adalah ...',['Musyawarah untuk mufakat','Memaksakan kehendak','Saling bertengkar'],'Musyawarah adalah pengamalan sila ke-4. Semua pendapat didengar dan keputusan diambil bersama.'],
[2,'Zona 2 · Sejarah dan Persatuan','Pembukaan UUD 1945 menyatakan bahwa kemerdekaan adalah ... segala bangsa.',['Hak','Hadiah','Kewajiban'],'Alinea pertama Pembukaan: "Bahwa sesungguhnya kemerdekaan itu ialah hak segala bangsa." Karena itu penjajahan harus dihapuskan.'],
[3,'Zona 3 · Sumatera','Wawasan Nusantara memandang Indonesia sebagai ...',['Satu kesatuan wilayah, bangsa, dan budaya','Beberapa negara bagian','Kumpulan suku yang terpisah'],'Wawasan Nusantara adalah cara pandang bangsa Indonesia bahwa seluruh wilayah, penduduk, dan sumber daya adalah satu kesatuan.'],

[3,'Zona 3 · Kalimantan','Menyebarkan berita bohong (hoaks) di media sosial dapat ...',['Memecah belah persatuan bangsa','Mempererat persaudaraan','Menambah pengetahuan'],'Hoaks dapat menimbulkan salah paham dan permusuhan. Selalu periksa kebenaran informasi sebelum membagikannya.'],
[3,'Zona 3 · Sulawesi','Semboyan Bhinneka Tunggal Ika berasal dari kitab ...',['Sutasoma karya Mpu Tantular','Negarakertagama','Pararaton'],'Kalimat "Bhinneka Tunggal Ika tan hana dharma mangrwa" terdapat dalam Kakawin Sutasoma karya Mpu Tantular pada masa Majapahit.'],
[3,'Zona 3 · Papua','Wilayah NKRI membentang dari Sabang sampai ...',['Merauke','Makassar','Kupang'],'Sabang di ujung barat Pulau Sumatera dan Merauke di ujung timur Pulau Papua. Dari ujung ke ujung, kita satu NKRI.']

addQ2('sd',16,[[4, "Zona 4 · Negara Maritim", "Indonesia memiliki laut yang sangat luas. Karena itu Indonesia disebut negara ...", ["Maritim (negara bahari)", "Gurun", "Beku"], "Negara maritim adalah negara yang wilayah lautnya luas dan banyak penduduknya hidup dari laut."], [4, "Zona 4 · Terumbu Karang", "Terumbu karang adalah rumah bagi ikan. Sikap yang benar terhadap terumbu karang adalah ...", ["Menjaga dan tidak merusaknya", "Mengambilnya untuk dibawa pulang", "Menginjak-injaknya"], "Terumbu karang perlu dijaga agar ikan dan makhluk laut lainnya tetap punya rumah."], [4, "Zona 4 · Laut dan Lingkungan", "Membuang sampah plastik ke laut dapat ...", ["Membahayakan ikan dan penyu", "Membuat laut makin bersih", "Menambah makanan ikan"], "Sampah plastik bisa tertelan hewan laut dan mencemari air. Buanglah sampah pada tempatnya."], [4, "Zona 4 · Gotong Royong di Laut", "Para nelayan menarik jala bersama-sama agar pekerjaan cepat selesai. Sikap ini disebut ...", ["Gotong royong", "Berebut", "Mementingkan diri sendiri"], "Gotong royong artinya bekerja bersama. Pekerjaan berat menjadi ringan dan persaudaraan makin kuat."], [4, "Zona 4 · Batas Wilayah Laut", "Lagu \"Nenek Moyangku Orang Pelaut\" mengajak kita untuk ...", ["Bangga dan menjaga laut Indonesia", "Takut pada laut", "Meninggalkan laut"], "Nenek moyang kita adalah pelaut yang gagah berani. Kita bangga dan menjaga laut sebagai milik bersama."], [5, "Zona 5 · Pengamalan Pancasila", "Menolong teman yang terjatuh adalah pengamalan Pancasila sila ...", ["Sila ke-2 (Kemanusiaan yang adil dan beradab)", "Sila ke-4", "Sila ke-5"], "Menolong sesama manusia adalah wujud sila ke-2, Kemanusiaan yang adil dan beradab."], [5, "Zona 5 · Pengamalan Pancasila", "Memilih ketua kelas dengan musyawarah dan menghargai pendapat teman sesuai dengan sila ...", ["Sila ke-4", "Sila ke-1", "Sila ke-3"], "Sila ke-4 mengajarkan musyawarah. Semua pendapat didengar sebelum memutuskan."], [5, "Zona 5 · Pengamalan Pancasila", "Membuang sampah pada tempatnya adalah ...", ["Kewajiban untuk menjaga kebersihan lingkungan", "Pilihan yang tidak penting", "Tugas orang dewasa saja"], "Menjaga kebersihan adalah kewajiban kita semua agar lingkungan sehat dan nyaman."], [5, "Zona 5 · Pengamalan Pancasila", "Berdoa sebelum belajar sesuai dengan sila ...", ["Sila ke-1", "Sila ke-2", "Sila ke-5"], "Sila ke-1 adalah Ketuhanan Yang Maha Esa. Berdoa menunjukkan kita taat beribadah."], [5, "Zona 5 · Pengamalan Pancasila", "Lambang sila ke-5 Pancasila adalah ...", ["Padi dan kapas", "Bintang", "Rantai"], "Padi dan kapas melambangkan keadilan sosial: sandang dan pangan untuk semua. Bintang sila ke-1, rantai sila ke-2."]]);
addQ2('smp',16,[[4, "Zona 4 · Negara Maritim", "Indonesia disebut negara maritim karena ...", ["Wilayah lautnya lebih luas daripada daratannya", "Tidak memiliki daratan", "Hanya memiliki satu pulau", "Lautnya milik negara lain"], "Sekitar dua pertiga wilayah Indonesia adalah laut. Laut menjadi sumber pangan, jalur perdagangan, dan penghubung antarpulau."], [4, "Zona 4 · Terumbu Karang", "Wilayah laut sejauh 200 mil laut dari garis pangkal, tempat Indonesia berhak mengelola sumber daya alamnya, disebut ...", ["Zona Ekonomi Eksklusif (ZEE)", "Laut bebas", "Zona netral", "Laut teritorial"], "Dalam ZEE, negara pantai memiliki hak berdaulat atas sumber daya alam, misalnya ikan dan minyak."], [4, "Zona 4 · Laut dan Lingkungan", "Menangkap ikan dengan bom atau racun merupakan tindakan yang ...", ["Merusak ekosistem dan merugikan masyarakat luas", "Dapat dibenarkan asalkan hasilnya banyak", "Menguntungkan nelayan kecil selamanya", "Tidak berdampak apa pun"], "Bom dan racun membunuh terumbu karang serta ikan kecil, sehingga hasil laut berkurang di masa depan."], [4, "Zona 4 · Gotong Royong di Laut", "Nelayan yang bergotong royong membersihkan pantai dan laut mencerminkan nilai ...", ["Persatuan dan gotong royong", "Individualisme", "Persaingan tidak sehat", "Egoisme daerah"], "Menjaga lingkungan bersama adalah wujud persatuan dan gotong royong, nilai dalam sila ke-3."], [4, "Zona 4 · Batas Wilayah Laut", "Pulau-pulau terluar perlu dijaga karena merupakan ...", ["Titik pangkal yang menentukan batas wilayah negara", "Tempat yang tidak penting karena jauh", "Wilayah negara lain", "Daerah bebas tanpa aturan"], "Pulau terluar menjadi titik pangkal penarikan batas laut. Menjaganya berarti menjaga kedaulatan NKRI."], [5, "Zona 5 · Pengamalan Pancasila", "Hak dan kewajiban warga negara dibedakan sebagai berikut ...", ["Hak adalah sesuatu yang diterima, kewajiban adalah sesuatu yang harus dilaksanakan", "Hak harus dilaksanakan, kewajiban diterima", "Hak boleh dituntut tanpa melaksanakan kewajiban", "Kewajiban hanya milik pemerintah"], "Hak dan kewajiban harus seimbang. Kita menuntut hak setelah menunaikan kewajiban."], [5, "Zona 5 · Pengamalan Pancasila", "Contoh pengamalan sila ke-4 di sekolah adalah ...", ["Memilih ketua OSIS melalui pemilihan yang jujur dan musyawarah", "Memaksakan kehendak kepada anggota", "Memilih berdasarkan kesamaan suku", "Mengabaikan hasil suara"], "Sila ke-4 menekankan musyawarah, kejujuran, dan menghormati keputusan bersama."], [5, "Zona 5 · Pengamalan Pancasila", "Sikap antikorupsi yang dapat dilatih sejak sekolah adalah ...", ["Jujur dan bertanggung jawab", "Berbagi contekan", "Menerima suap kecil", "Menutupi kesalahan teman"], "Kejujuran adalah benteng antikorupsi. Kebiasaan kecil, seperti tidak mencontek, membentuk karakter besar."], [5, "Zona 5 · Pengamalan Pancasila", "Pasal 28A sampai 28J UUD NRI Tahun 1945 mengatur tentang ...", ["Hak asasi manusia", "Kekuasaan kehakiman", "Keuangan negara", "Pertahanan dan keamanan negara"], "Bab XA UUD NRI Tahun 1945 memuat jaminan hak asasi manusia. Pertahanan negara diatur di Pasal 30."], [5, "Zona 5 · Pengamalan Pancasila", "Sila ke-5 Pancasila diwujudkan dengan sikap ...", ["Bersikap adil dan menolong sesama sesuai kemampuan", "Mementingkan kelompok sendiri", "Bermewah-mewahan", "Bekerja hanya demi keuntungan pribadi"], "Keadilan sosial berarti bersikap adil, gotong royong, dan peduli pada sesama."]]);
addQ2('sma',16,[[4, "Zona 4 · Negara Maritim", "Konvensi Hukum Laut PBB (UNCLOS 1982), yang diratifikasi Indonesia dengan UU No. 17 Tahun 1985, mengakui Indonesia sebagai ...", ["Negara kepulauan (archipelagic state)", "Negara pantai biasa", "Negara tanpa laut", "Negara kontinental", "Negara netral"], "UNCLOS 1982 mengakui konsep negara kepulauan, sehingga perairan di antara pulau Indonesia diakui sebagai satu kesatuan wilayah."], [4, "Zona 4 · Terumbu Karang", "Kewenangan Indonesia di Zona Ekonomi Eksklusif (ZEE) adalah ...", ["Hak berdaulat mengelola sumber daya alam, bukan kedaulatan penuh", "Kedaulatan penuh seperti di wilayah daratan", "Tidak memiliki hak apa pun", "Hanya hak lintas damai", "Melarang semua kapal asing berlayar"], "Di ZEE, negara pantai memiliki hak berdaulat atas sumber daya, sedangkan pelayaran dan penerbangan internasional tetap bebas."], [4, "Zona 4 · Laut dan Lingkungan", "Pasal 33 ayat (3) UUD NRI Tahun 1945 menyatakan bahwa ...", ["Bumi, air, dan kekayaan alam di dalamnya dikuasai negara dan dipergunakan untuk sebesar-besar kemakmuran rakyat", "Perekonomian disusun sebagai usaha bersama berdasar asas kekeluargaan", "Setiap warga negara berhak mendapat pekerjaan", "Fakir miskin dan anak terlantar dipelihara negara", "Negara memajukan kebudayaan nasional"], "Pasal 33 ayat (3) menjadi dasar pengelolaan sumber daya alam, termasuk laut, untuk kemakmuran rakyat."], [4, "Zona 4 · Gotong Royong di Laut", "Penangkapan ikan ilegal (illegal fishing) oleh kapal asing terutama mengancam NKRI di bidang ...", ["Ekonomi dan kedaulatan sumber daya maritim", "Budaya saja", "Olahraga", "Pendidikan saja", "Kesehatan saja"], "Illegal fishing merugikan negara dan nelayan, serta melemahkan kedaulatan atas sumber daya maritim. Ini termasuk ancaman nonmiliter."], [4, "Zona 4 · Batas Wilayah Laut", "Pengelolaan laut yang berkelanjutan sejalan dengan sila ke-5 karena ...", ["Manfaat sumber daya laut harus dinikmati secara adil oleh seluruh rakyat, termasuk generasi mendatang", "Hanya menguntungkan perusahaan besar", "Hasil laut boleh dikuasai sebagian pihak", "Laut hanya untuk diekspor", "Tidak berhubungan dengan Pancasila"], "Keadilan sosial berarti manfaat kekayaan alam dirasakan merata dan lestari bagi semua rakyat, sekarang dan nanti."], [5, "Zona 5 · Pengamalan Pancasila", "Prinsip bahwa Indonesia adalah negara hukum tercantum dalam ...", ["Pasal 1 ayat (3) UUD NRI Tahun 1945", "Pasal 1 ayat (1) UUD NRI Tahun 1945", "Pasal 1 ayat (2) UUD NRI Tahun 1945", "Pasal 29 ayat (1) UUD NRI Tahun 1945", "Pasal 33 ayat (1) UUD NRI Tahun 1945"], "Pasal 1 ayat (3): Negara Indonesia adalah negara hukum. Artinya hukum berlaku sama untuk semua."], [5, "Zona 5 · Pengamalan Pancasila", "Pasal 27 ayat (1) UUD NRI Tahun 1945 menegaskan bahwa ...", ["Segala warga negara bersamaan kedudukannya di dalam hukum dan pemerintahan", "Setiap orang berhak memperoleh pendidikan", "Bumi, air, dan kekayaan alam dikuasai negara", "Negara menjamin kebebasan beragama", "Presiden memegang kekuasaan pemerintahan"], "Semua warga negara sama kedudukannya di hadapan hukum dan pemerintahan, tanpa diskriminasi."], [5, "Zona 5 · Pengamalan Pancasila", "Pancasila sebagai ideologi terbuka berarti ...", ["Nilai dasarnya tetap, sedangkan nilai instrumental dan praksisnya dapat berkembang mengikuti zaman", "Isinya boleh diganti kapan saja", "Menutup diri dari perkembangan", "Hanya berlaku pada masa lalu", "Dapat diganti jika mayoritas setuju"], "Nilai dasar Pancasila bersifat tetap. Penjabarannya dalam aturan dan praktik terus berkembang dengan tetap sejalan dengan nilai dasar."], [5, "Zona 5 · Pengamalan Pancasila", "Demokrasi Pancasila sesuai sila ke-4 menempatkan ...", ["Musyawarah mufakat dan kedaulatan rakyat sebagai dasar pengambilan keputusan", "Kekuasaan pada satu golongan", "Suara terbanyak tanpa hikmat kebijaksanaan", "Keputusan elite saja", "Hak mayoritas di atas hak minoritas"], "Demokrasi Pancasila mengutamakan musyawarah untuk mufakat dengan hikmat kebija const PI=[{},{},{}];let PP=[{},{},{}];
function setP(i,k,d){if(d&&!PI[i][k])PP[i][k]=true;PI[i][k]=d;}

let P=[];
function burst(x,y,n,c,spd){spd=spd||160;for(let i=0;i<n;i++){const a=Math.random()*TAU,s=spd*(.3+Math.random());P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,l:.5+Math.random()*.4,m:.9,c:c,r:2+Math.random()*3});}}
function updP(dt,g){for(const p of P){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g==null?g:p.g)*dt;}P=P.filter(p=>p.l>0);}
function drawP(ox,oy){for(const p of P){ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x-ox,p.y-oy,p.r,0,TAU);ctx.fill();}ctx.globalAlpha=1;}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,size,col,al,w){ctx.font='700 '+size+'px Fredoka,system-ui,sans-serif';ctx.textAlign=al||'left';ctx.textBaseline='alphabetic';ctx.lineJoin='round';const lw=w==null?Math.max(3,size/5):w;if(lw>0){ctx.lineWidth=lw;ctx.strokeStyle='rgba(10,20,50,.7)';ctx.strokeText(s,x,y);}ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
function circ(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();}
function ell(c,x,y,rx,ry,rot,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y,rx,ry,rot||0,0,TAU);c.fill();}
function drawRing(c,x,y,r,t,ph){c.save();c.translate(x,y);c.scale(Math.max(.25,Math.abs(Math.cos(t*4+ph))),1);c.strokeStyle='#ffb300';c.lineWidth=r*.38;c.beginPath();c.arc(0,0,r,0,TAU);c.stroke();c.strokeStyle='#ffe066';c.lineWidth=r*.14;c.beginPath();c.arc(0,0,r,3.8,5.4);c.stroke();c.restore();}

const ov=$('overlay'),ACT={};
let QZ=null,EX=null;
function showOv(html){ov.innerHTML=html;ov.classList.add('show');ov.scrollTop=0;const b=ov.querySelector('.btn');if(b&&b.focus)try{b.focus({preventScroll:true});}catch(e){}}
function hideOv(){ov.classList.remove('show');ov.innerHTML='';}
ov.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(f)f(a.dataset.v);});
function ask(q,cb){
  G.paused=true;
  const opts=shuffle(q.o.map((t,i)=>({t:t,ok:i===q.a})));
  QZ={q:q,opts:opts,cb:cb,done:false,ok:false};
  showOv('<div class="card"><span class="tag">'+(QWHO?QWHO+' · ':'')+q.topic+'</span><h2>'+q.q+'</h2><div class="opts">'+opts.map((x,i)=>'<button class="opt" type="button" data-act="qopt" data-v="'+i+'"><b>'+'ABCDEF'.charAt(i)+'</b><span>'+x.t+'</span></button>').join('')+'</div><div id="fb"></div></div>');
}
function answerQ(i){
  if(!QZ||QZ.done)return;const o=QZ.opts[i];if(!o)return;
  QZ.done=true;QZ.ok=o.ok;recordAnswer(QZ.q,o.ok);
  ov.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(QZ.opts[k].ok)b.classList.add('right');else if(k===i)b.classList.add('wrong');});
  $('fb').innerHTML='<div class="fb '+(o.ok?'ok':'no')+'"><img class="face" src="'+SPR_DATA[o.ok?'f_ok':'f_bad'].uri+'" alt=""><b>'+(o.ok?'Benar! 🎉':'Belum tepat 🤔')+'</b><p>'+QZ.q.why+'</p><button class="btn" type="button" data-act="qnext">Lanjut ▶</button></div>';
  const b=ov.querySelector('.btn');if(b)try{b.focus({preventScroll:true});}catch(e){}
  sfx(o.ok?'good':'bad');
}
ACT.qopt=v=>answerQ(+v);
ACT.qnext=()=>{const z=QZ;QZ=null;hideOv();G.paused=false;if(z&&z.cb)z.cb(z.ok);};
function explain(q,chosen,correct,cb){
  G.paused=true;EX=cb;
  showOv('<div class="card"><span class="tag">'+q.topic+'</span><h2>'+q.q+'</h2><div class="fb no"><img class="face" src="'+SPR_DATA.f_bad.uri+'" alt=""><b>Belum tepat 🤔</b><p>Kamu memilih: <i>'+chosen+'</i></p><p>Jawaban yang benar: <b>'+correct+'</b></p><p>'+q.why+'</p><button class="btn" type="button" data-act="exnext">Lanjut ▶</button></div></div>');
}
ACT.exnext=()=>{hideOv();G.paused=false;const f=EX;EX=null;if(f)f();};

  const hz={sd:'<b>Arus laut</b> (panah putih) hanya menghanyutkan pelan. Tidak ada pusaran air',smp:'<b>Arus laut</b> menghanyutkan, dan <b>2 pusaran air</b> menyedot serta melukai. Lewati dengan kepak, dash, atau terbang',sma:'<b>Arus laut</b> menghanyutkan, dan <b>4 pusaran air</b> menyedot serta melukai. Lewati dengan kepak, dash, atau terbang'}[lv];
  return ['<b>WASD</b> atau <b>panah</b>: bergerak bebas di Nusantara','<b>Shift</b>: boost, tubuh berputar seperti bola, kebal, dan mengalahkan Hoaks yang ditabrak',box+' di setiap pulau: <b>tabrak kotaknya</b> untuk menjawab soal penjaga pulau. Terbang di atasnya berarti melewatinya','Di laut Panca berenang sambil <b>mengepakkan sayap</b>. Tekan <b>Spasi</b> untuk kepakan kuat (dorongan cepat)',hz,'<b>Tanda sayap</b> membuatnya terbang di atas laut dan Hoaks selama 10 detik'];
}
function ZI(n){const lv=G.lv||'sma',z=ZV[lv][n];return{name:'Zona '+n+' · '+z.name,style:ZB[n],sub:z.sub,obj:z.obj,tip:z.tip,ctl:ctlFor(n,lv)};}
const HINTS={1:'← → jalan/lari · Spasi lompat · Shift dash = berputar & kebal · ↑↓ berenang · tabrak kotak ? untuk soal.',2:'← → pindah jalur · Spasi lompat · tabrak kotak ? untuk soal · Shift boost.',3:'WASD/panah bergerak · Shift boost · Spasi kepak di laut · tabrak kotak ? di pulau untuk soal.',4:'← → jalan di dasar laut · Spasi/↑ loncat, tahan untuk berenang naik · ↓ turun · sentuh kotak ? untuk soal.',5:'WASD/panah atau analog: jalan di labirin · sentuh 5 kotak ? lalu capai Tugu Persatuan · hindari Hoaks.'};
function stars(n){return '★'.repeat(n)+'☆'.repeat(3-n);}
let TM='analog';
const ANLAB={4:'geser = jalan · atas = loncat/berenang',5:'360° · jalan di labirin',1:'jalan · atas = lompat/berenang',2:'geser = pindah jalur · atas = lompat',3:'360° · makin jauh makin cepat'};
function setTouch(n0){
  const n=n0?ENG[n0]:0;
  const multi=n0===2&&(G.mp||1)>1;
  $('touch').classList.toggle('on',n>0);
  const an=$('analog');
  an.hidden=!(n>0&&TM==='analog'&&!multi);an.className='analog a'+(n||1);
  const kn=an.querySelector('.knob');if(kn)kn.style.transform='';
  $('analab').textContent=ANLAB[n]||'';
  $('dirs').hidden=!(n>0&&TM==='dpad'&&!multi);
  $('acts').hidden=multi||n===0||n===5;
  G.an={on:false,x:0,y:0};
  const mp=$('mp');mp.hidden=!multi;mp.innerHTML='';
  if(multi){
    for(let i=0;i<G.mp;i++){
      const d=document.createElement('div');d.className='pp';d.style.setProperty('--c',PCOL[i]);
      d.innerHTML='<b>P'+(i+1)+'</b><div class="analog a2"><div class="knob"></div></div><button class="tb b" type="button">Boost</button>';
      mp.appendChild(d);
      bindAnalog(d.querySelector('.analog'),()=>2,sinkP(i));
      bindTb(d.querySelector('.tb'),(on)=>setP(i,'boost',on));
    }
  }
  document.querySelectorAll('.tb[data-key]').forEach(b=>{b.hidden=!((b.dataset.m||'').split(' ').indexOf(String(n))>=0);});
  const jb=document.querySelector('.tb[data-key=jump]');if(jb)jb.textContent=n===3?'Kepak':n===4?'Loncat':'Lompat';
}
function sinkMain(){return{set:(k,on)=>setKey(k,on),tap:k=>{setKey(k,true);setKey(k,false);},an:(x,y)=>{G.an={on:Math.hypot(x,y)>.05,x:x,y:y};}};}
function sinkP(i){return{set:(k,on)=>setP(i,k,on),tap:k=>{setP(i,k,true);setP(i,k,false);},an:()=>{}};}
function bindTb(b,fn){
  const dn=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(x){}b.classList.add('down');fn(true);};
  const up=()=>{if(b.classList.contains('down')){b.classList.remove('down');fn(false);}};
  b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
}
function bindAnalog(el,zone,sink){
  const kn=el.querySelector('.knob');let pid=null;const arm={l:1,r:1,u:1};
  const apply=(x,y)=>{
    const z=zone();
    if(z===3||z===5){sink.an(x,y);return;}
    if(z===1){sink.set('left',x<-.3);sink.set('right',x>.3);sink.set('up',y<-.5);sink.set('down',y>.5);return;}
    if(x>.55&&arm.r){arm.r=0;sink.tap('right');}
    if(x<-.55&&arm.l){arm.l=0;sink.tap('left');}
    if(Math.abs(x)<.3){arm.r=1;arm.l=1;}
    if(y<-.5&&arm.u){arm.u=0;sink.tap('jump');}
    if(y>-.2)arm.u=1;
  };
  const mv=e=>{const r=el.getBoundingClientRect(),hx=r.width/2,hy=r.height/2;let x=(e.clientX-r.left-hx)/hx,y=(e.clientY-r.top-hy)/hy;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}const kw=kn.offsetWidth/2;kn.style.transform='translate('+(x*(hx-kw)).toFixed(1)+'px,'+(y*(hy-kw)).toFixed(1)+'px)';apply(x,y);};
  el.addEventListener('pointerdown',e=>{if(pid!==null)return;e.preventDefault();pid=e.pointerId;try{el.setPointerCapture(pid);}catch(x){}mv(e);});
  el.addEventListener('pointermove',e=>{if(e.pointerId===pid)mv(e);});
  const end=e=>{if(e.pointerId!==pid)return;pid=null;kn.style.transform='';arm.l=arm.r=arm.u=1;apply(0,0);};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
function screenTitle(){
  musicStop();G.mode='menu';G.paused=false;setTouch(0);
  showOv('<div class="card"><div class="hero"><div><div class="logo">GARUDA DASH</div><h1>Misi Persatuan NKRI</h1></div><img src="'+SPR_DATA.main.uri+'" alt="Panca, garuda cilik"></div><p class="lead">Game belajar Pendidikan Pancasila. Bantu <b>Panca</b>, garuda cilik bermahkota, berlari menjelajahi Nusantara. Kumpulkan koin, kalahkan <b>Hoaks</b>, dan jawab tantangan seputar NKRI!</p><div class="modes"><span>🏃 2D Klasik</span><span>🚀 3D Boost</span><span>🗺️ Open Zone</span><span>🌊 Bawah Laut</span><span>🧭 Labirin</span><span>🎓 SD · SMP · SMA</span></div><button class="btn big" type="button" data-act="level">Mulai Petualangan ▶</button></div>');
}
function screenLevel(){
  musicStop();G.mode='menu';G.paused=false;setTouch(0);QZ=null;
  const cards=['sd','smp','sma'].map(k=>{const L=LVL[k],rs=G.res[k]||{};let t=0;[1,2,3,4,5].forEach(n=>{if(rs[n])t+=rs[n].stars;});return '<button class="scard" type="button" data-act="setlv" data-v="'+k+'"><span class="n">'+L.kelas+'</span><b>'+L.emo+' '+L.label+'</b><small>'+L.desc+'</small><span class="stars">'+t+'/15 ★</span></button>';}).join('');
  showOv('<div class="card"><span class="tag">Pilih jenjang</span><h2>Kamu belajar di jenjang apa?</h2><p>Setiap jenjang punya latar, rintangan, dan soal yang berbeda.</p><div class="stages">'+cards+'</div></div>');
}
ACT.level=()=>screenLevel();
ACT.setlv=v=>{G.lv=v;TH1=T1[v]||T1.smp;save();screenSelect();};
function screenSelect(){
  if(!G.lv){screenLevel();return;}
  musicStop();G.mode='menu';G.paused=false;setTouch(0);QZ=null;
  let total=0;const rs=G.res[G.lv]||{},L=LVL[G.lv];
  const cards=[1,2,3,4,5].map(n=>{const z=ZI(n),r=rs[n];if(r)total+=r.stars;return '<button class="scard" type="button" data-act="brief" data-v="'+n+'"><span class="n">'+z.style+'</span><b>'+z.name+'</b><small>'+z.sub+'</small><span class="stars">'+(r?stars(r.stars):'☆☆☆')+'</span><small>'+(r?'Benar '+r.correct+'/'+r.total+' · Skor '+r.score:'Belum dimainkan')+'</small></button>';}).join('');
  showOv('<div class="card"><span class="tag">Jenjang '+L.label+' · '+L.kelas+'</span><h2>Lima zona, satu misi: menjaga NKRI</h2><div class="stages">'+cards+'</div><div class="row"><button class="btn ghost" type="button" data-act="rapor">📋 Rapor belajar ('+total+'/15 ★)</button><button class="btn ghost" type="button" data-act="level">🎓 Ganti jenjang</button></div></div>');
}
ACT.select=()=>screenSelect();
ACT.brief=v=>{
  const n=+v,z=ZI(n);G.mode='menu';
  showOv('<div class="card"><span class="tag">'+z.style+'</span><h2>'+z.name+' · '+z.sub+'</h2><p><b>Tujuan pembelajaran.</b> '+z.obj+'</p>'+(n===2?npPicker():'')+'<p><b>Kontrol</b> (di layar sentuh: analog atau tombol di bawah layar)</p><ul class="ctl">'+z.ctl.map(c=>'<li>'+c+'</li>').join('')+(n===2&&G.np>1?'<li><b>P1</b>: A/D pindah jalur, W lompat, S boost · <b>P2</b>: ←/→, ↑ lompat, ↓ boost'+(G.np>2?' · <b>P3</b>: J/L, I lompat, K boost':'')+'. Di layar sentuh tiap pemain punya analog sendiri di dalam layar permainan.</li><li><b>Balapan:</b> tiap pemain berlari sendiri. Yang tertinggal mendapat dorongan kejar, dan berlari tepat di belakang lawan memberi <b>slipstream</b> (garis putih). Tabrakan atau salah jalur membuatmu melambat. Siapa lebih dulu mencapai Tugu NKRI menang. Saat satu pemain menjawab soal, permainan berhenti sebentar.</li><li>Hati dan koin dipakai <b>bersama</b> ('+(3+2*(G.np-1))+' hati). Siapa yang menabrak kotak ?, dialah yang menjawab (tim boleh berdiskusi).</li>':'')+'</ul><p><b>Tips.</b> '+z.tip+' Tidak ada game over: kalau hati habis, hatimu dipulihkan dan kamu terus belajar.</p><div class="row"><button class="btn big" type="button" data-act="play" data-v="'+n+'">Mulai ▶</button><button class="btn ghost" type="button" data-act="select">Kembali</button></div></div>');
};
function npPicker(){return '<p><b>Jumlah pemain</b> (satu layar, maksimal 3)</p><div class="row">'+[1,2,3].map(k=>'<button class="btn'+(G.np===k?'':' ghost')+'" type="button" data-act="np" data-v="'+k+'">'+k+' pemain</button>').join('')+'</div>';}
ACT.np=v=>{G.np=+v;ACT.brief(2);};
ACT.play=v=>startStage(+v);
function startStage(n){
  G.stage=n;G.mp=n===2?(G.np||1):1;G.hmax=n===2?3+2*(G.mp-1):3;G.hearts=G.hmax;G.an={on:false,x:0,y:0};PP=[{},{},{}];for(let i=0;i<3;i++)PI[i]={};G.rings=0;G.score=0;G.paused=false;G.wing=0;G.pm=false;G.ball=false;QZ=null;EX=null;
  G.run={asked:{},total:0,correct:0,missed:[]};
  pressed={};for(const k in keys)keys[k]=false;G.raceNote='';
  hideOv();$('toast').classList.remove('show');
  {const e=ENG[n];if(e===1)s1Init();else if(e===2)s2Init();else if(e===4)s4Init();else if(e===5)s5Init();else s3Init();}
  G.mode='play';setTouch(n);$('hint').textContent=(n===2&&G.mp>1)?'Mode '+G.mp+' pemain · P1: A/D, W lompat, S boost · P2: ←/→, ↑ lompat, ↓ boost'+(G.mp>2?' · P3: J/L, I lompat, K boost':'')+' · tabrak kotak ? untuk soal.':HINTS[ENG[n]];musicStop();musicStart(n);
  toast(ENG[n]===1?'Lari ke kanan! Tabrak Kotak Pertanyaan (?) untuk menjawab soal.':ENG[n]===2?'Pindah jalur dengan ← →. Tabrak kotak ? untuk membuka soal!':ENG[n]===4?'Selamlah ke dasar laut! Berjalan, loncat, dan berenang. Sentuh kotak ? untuk soal.':ENG[n]===5?'Masuki labirin! Cari 5 kotak ? lalu menuju Tugu. Ikuti panah emas.':'Tabrak kotak ? di tiap pulau. Ikuti panah emas!',3400);
}
function completeStage(n){
  if(G.mode!=='play'||G.stage!==n)return;
  const r=G.run,st=r.correct>=5?3:r.correct>=3?2:1;
  const res={stars:st,correct:r.correct,total:r.total,score:G.score,rings:G.rings,missed:r.missed.slice()};
  const prev=RES()[n];
  if(!prev||st>prev.stars||(st===prev.stars&&res.score>prev.score))RES()[n]=res;
  G.mode='result';G.ball=false;setTouch(0);save();musicStop();sfx('win');
  const miss=res.missed.map(id=>{const q=QBY[id];return '<div class="miss"><b>'+q.q+'</b><br>Jawaban benar: '+q.o[q.a]+'<br>'+q.why+'</div>';}).join('');
  const nextBtn=n<5?'<button class="btn" type="button" data-act="brief" data-v="'+(n+1)+'">Zona berikutnya ▶</button>':'<button class="btn" type="button" data-act="rapor">Lihat rapor belajar ▶</button>';
  showOv('<div class="card"><span class="tag">'+LVL[G.lv].label+' · '+ZI(n).name+' selesai</span><h2>Hebat! Kamu menyelesaikan zona ini.</h2>'+(G.raceNote?'<p><b>'+G.raceNote+'</b></p>':'')+'<div class="stars big-stars">'+stars(st)+'</div><div class="stat"><div>Benar sekali jawab: '+res.correct+'/'+res.total+'</div><div>Koin: '+res.rings+'</div><div>Skor: '+res.score+'</div></div>'+(res.total<5?'<p><b>Kamu melewatkan '+(5-res.total)+' kotak soal.</b> Ulangi zona dan tabrak semua kotak ? agar semua materi terjawab.</p>':'')+(miss?'<p><b>Materi yang perlu diulang</b></p>'+miss:(res.total>=5?'<p>Semua soal terjawab benar pada percobaan pertama. Luar biasa!</p>':''))+'<div class="row">'+nextBtn+'<button class="btn ghost" type="button" data-act="brief" data-v="'+n+'">Ulangi zona</button><button class="btn ghost" type="button" data-act="select">Pilih zona</button></div></div>');
}
ACT.rapor=()=>{
  G.mode='menu';setTouch(0);
  let tot=0,rows='',miss='';
  [1,2,3,4,5].forEach(n=>{const r=(G.res[G.lv]||{})[n];if(r){tot+=r.stars;r.missed.forEach(id=>{const q=QBY[id];miss+='<div class="miss"><b>'+ZI(n).name+':</b> '+q.q+'<br>Jawaban benar: '+q.o[q.a]+'<br>'+q.why+'</div>';});}
    rows+='<tr><td>'+ZI(n).name+'</td><td>'+ZI(n).style+'</td><td class="stars">'+(r?stars(r.stars):'☆☆☆')+'</td><td>'+(r?r.correct+'/'+r.total:'-')+'</td><td>'+(r?r.score:'-')+'</td></tr>';});
  const title=tot>=13?'Duta Persatuan':tot>=8?'Penjaga NKRI':'Garuda Muda';
  showOv('<div class="card"><span class="tag">Rapor belajar</span><h2>Gelarmu di '+LVL[G.lv||'sma'].label+': '+title+' ('+tot+'/15 ★)</h2><div class="tblwrap"><table><thead><tr><th>Zona</th><th>Gaya</th><th>Bintang</th><th>Benar</th><th>Skor</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+(miss?'<p><b>Materi yang perlu diulang</b></p>'+miss:'<p>'+(tot?'Tidak ada materi yang perlu diulang. Pertahankan!':'Mainkan zona untuk melihat hasil belajarmu di sini.')+'</p>')+'<div class="row"><button class="btn" type="button" data-act="select">Pilih zona</button><button class="btn ghost" type="button" data-act="level">Ganti jenjang</button></div></div>');
};
function pauseMenu(){
  if(G.mode!=='play'||G.paused)return;
  G.paused=true;G.pm=true;musicStop();
  showOv('<div class="card"><h2>Jeda ⏸</h2><div class="row"><button class="btn" type="button" data-act="resume">Lanjutkan ▶</button><button class="btn ghost" type="button" data-act="restart">Ulangi zona</button><button class="btn ghost" type="button" data-act="select">Pilih zona</button></div></div>');
}
ACT.resume=()=>{hideOv();G.paused=false;G.pm=false;musicStart(G.stage);};
ACT.restart=()=>startStage(G.stage);

/* ================= INPUT ================= */
const MPK={a:[0,'left'],d:[0,'right'],w:[0,'jump'],s:[0,'boost'],ArrowLeft:[1,'left'],ArrowRight:[1,'right'],ArrowUp:[1,'jump'],ArrowDown:[1,'boost'],j:[2,'left'],l:[2,'right'],i:[2,'jump'],k:[2,'boost']};
const KM={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',' ':'jump',Shift:'boost',e:'talk'};
window.addEventListener('keydown',e=>{
  if(ov.classList.contains('show')){if(QZ&&!QZ.done&&e.key&&e.key.length===1){const kk='abcdef'.indexOf(e.key.toLowerCase());if(kk>=0&&kk<QZ.opts.length)answerQ(kk);}return;}
  if(e.key==='Escape'){pauseMenu();return;}
  const key=e.key&&e.key.length===1?e.key.toLowerCase():e.key;
  if(G.mode==='play'&&G.stage===2&&G.mp>1){const m=MPK[key];if(m&&m[0]<G.mp){e.preventDefault();setP(m[0],m[1],true);}return;}
  const k=KM[key];
  if(k&&G.mode==='play'){e.preventDefault();setKey(k,true);}
});
window.addEventListener('keyup',e=>{const key=e.key&&e.key.length===1?e.key.toLowerCase():e.key,k=KM[key],m=MPK[key];if(k)setKey(k,false);if(m)setP(m[0],m[1],false);});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(let i=0;i<3;i++)PI[i]={};});
document.querySelectorAll('.tb[data-key]').forEach(b=>bindTb(b,on=>setKey(b.dataset.key,on)));
bindAnalog($('analog'),()=>ENG[G.stage]||1,sinkMain());
try{if(matchMedia('(any-pointer:coarse)').matches||navigator.maxTouchPoints>0)$('touch').classList.add('force');}catch(e){}
$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent=muted?'🔇 Suara mati':'🔊 Suara';if(muted)musicStop();else{ensureAC();sfx('ring');if(G.mode==='play'&&!G.pm)musicStart(G.stage);}});
$('menu').addEventListener('click',()=>{if(G.mode==='play')pauseMenu();else if(!ov.classList.contains('show'))screenSelect();});

/* ================= LOOP ================= */
let last=0,acc=0;
function update(dt){const e=ENG[G.stage];if(e===1)s1Update(dt);else if(e===2)s2Update(dt);else if(e===3)s3Update(dt);else if(e===4)s4Update(dt);else if(e===5)s5Update(dt);}
function frame(now){
  const d=Math.min(.05,Math.max(0,(now-last)/1000));last=now;GT+=d;
  if(G.mode==='play'&&!G.paused){acc+=d;while(acc>=STEP){update(STEP);pressed={};PP=[{},{},{}];acc-=STEP;if(G.mode!=='play'||G.paused)break;}}
  if(G.mode==='menu')menuDraw(GT);
  else if(ENG[G.stage]===1)s1Draw();else if(ENG[G.stage]===2)s2Draw(GT);else if(ENG[G.stage]===3)s3Draw(GT);else if(ENG[G.stage]===4)s4Draw(GT);else if(ENG[G.stage]===5)s5Draw(GT);
  requestAnimationFrame(frame);
}
try{const bi=document.querySelector('.brand i');bi.style.background='url('+SPR_DATA.f_ok.uri+') center/contain no-repeat';bi.style.boxShadow='none';}catch(e){}
screenTitle();
requestAnimationFrame(t=>{last=t;frame(t);});
if(typeof window.__GDT==='function')window.__GDT({poseBack:poseBack,poseSwimFly:poseSwimFly,SPR_DATA:SPR_DATA,isLand:isLand,G:G,keys:keys,setKey:setKey,setP:setP,PI:PI,startStage:startStage,frame:frame,ACT:ACT,answerQ:answerQ,getQZ:()=>QZ,getS:()=>({S4:S4,S5:S5,S1:S1,S2:S2,S3:S3}),hasOv:()=>ov.classList.contains('show')});
})();
</script>
